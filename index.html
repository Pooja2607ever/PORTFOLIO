<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pooja Shankar | AR/VR Creator & Web Designer</title>
<meta name="description" content="Portfolio of Pooja Shankar, AR/VR content creator, website designer and CSBS student at Sri Sairam Engineering College.">
<meta name="theme-color" content="#0f0709">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Josefin+Slab:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

<style>
:root{
  --ink:#0f0709;
  --wine:#2a0d14;
  --coral:#f0555c;
  --blush:#ffb9ae;
  --bone:#fff4f1;
  --line:rgba(255,185,174,.22);
  --sans:'Josefin Sans','Segoe UI',system-ui,sans-serif;
  --slab:'Josefin Slab',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;color-scheme:dark}
body{background:var(--ink);color:var(--bone);font-family:var(--sans);font-weight:400;line-height:1.65;overflow-x:hidden}
::selection{background:var(--coral);color:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blush);outline-offset:3px}

/* 3D background (smoke + wireframe) */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.glow{position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(240,85,92,.22),transparent 65%);
  transform:translate(-50%,-50%);left:-999px;top:-999px;mix-blend-mode:screen}
main,header,footer{position:relative;z-index:2}

/* Navigation */
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,84px);
  padding:22px 20px;padding-top:max(22px,env(safe-area-inset-top));transition:background .4s,padding .4s}
nav.solid{background:rgba(15,7,9,.78);backdrop-filter:blur(12px);padding-top:max(12px,env(safe-area-inset-top));padding-bottom:12px}
nav a.l{font-weight:600;letter-spacing:.14em;font-size:.95rem;text-transform:uppercase;position:relative;padding:4px 0}
nav a.l::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:100%;background:var(--coral);transform:scaleX(0);transform-origin:left;transition:transform .35s}
nav a.l:hover::after,nav a.l.on::after{transform:scaleX(1)}
.logo{display:grid;place-items:center;width:44px;height:44px}
.logo svg{width:40px;height:40px;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.logo:hover svg{transform:rotate(180deg)}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--bone);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.1rem}

/* Side rails */
.dots{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:14px}
.dots a{width:7px;height:7px;border-radius:50%;background:rgba(255,244,241,.45);transition:.3s;position:relative}
.dots a.on{background:var(--coral);transform:scale(1.7);box-shadow:0 0 0 4px rgba(240,85,92,.25)}
.dots a span{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:.78rem;letter-spacing:.1em;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}
.dots a:hover span{opacity:1}
.social{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:15;border:1px solid var(--line);border-right:0;background:rgba(15,7,9,.55);backdrop-filter:blur(6px)}
.social a{display:grid;place-items:center;width:46px;height:46px;font-weight:600;font-size:.95rem;border-bottom:1px solid var(--line);transition:.3s}
.social a:last-child{border-bottom:0}
.social a:hover{background:var(--coral);color:var(--ink)}

/* Hero */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 90px}
.title{font-weight:700;font-size:clamp(2.6rem,9vw,6.4rem);letter-spacing:.06em;line-height:1.05;text-transform:uppercase;text-shadow:0 0 40px rgba(240,85,92,.45)}
.title span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(-70deg);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.tag{font-family:var(--slab);font-style:italic;font-size:clamp(1.15rem,2.6vw,1.7rem);color:var(--blush);margin-top:18px;opacity:0;animation:rise 1s 1.3s forwards}
.role{margin-top:12px;font-size:clamp(.95rem,2vw,1.
